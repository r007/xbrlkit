[package]
name = "xbrl"
version = "0.1.0"
edition = "2024"
description = "A high-performance, context-aware XBRL parser for SEC filings"

[dependencies]
# Serialization & Data
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
quick-xml = { version = "0.37.5", features = ["serialize", "serde"] }

# Error Handling & Logging
thiserror = "1.0"
tracing = "0.1"

# Internal dependencies
common = { path = "../common" }