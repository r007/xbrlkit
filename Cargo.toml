[package]
name = "xbrl"
version = "0.1.0"
edition = "2024"
description = "A high-performance, context-aware XBRL parser for SEC filings"

[dependencies]
# Serialization & Data
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
quick-xml = { workspace = true, features = ["serde"] }

# Utilities
once_cell = { workspace = true }
regex = { workspace = true }

# Error Handling & Logging
thiserror = { workspace = true }

# `#[derive(FromXbrl)]`
xbrl-derive = { path = "derive" }

[dev-dependencies]
# The taxonomy structs are stored through serde_arrow; a test holds them to it.
serde_arrow = { workspace = true }
arrow = { version = "55.2.0", default-features = false }
